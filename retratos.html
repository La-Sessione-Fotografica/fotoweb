<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retratos - Estudio Fotográfico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">La Sessione</a>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="galeria.html">Galería</a></li>
                <li><a href="portafolio.html">Portafolio</a></li>
            </ul>
        </nav>
    </header>

    <main class="galeria-contenedor">
        <h1>Retratos</h1>
        <button onclick="window.location.href='galeria.html'" class="btn-regresar">Regresar a Galería</button>
        <div class="galeria-grid">
            <!-- Agregar imágenes específicas de retratos -->
            <div class="imagen-card">
                <img src="img/retratos1.jpg" alt="Retrato 1">
            </div>
            <div class="imagen-card">
                <img src="img/retratos2.jpg" alt="Retrato 2">
            </div>
            <div class="imagen-card">
                <img src="img/retratos3.jpg" alt="Retrato 3">
            </div>
            <div class="imagen-card">
                <img src="img/retratos4.jpg" alt="Retrato 4">
            </div>
            <div class="imagen-card">
                <img src="img/retratos5.jpg" alt="Retrato 5">
            </div>
            <div class="imagen-card">
                <img src="img/retratos6.jpg" alt="Retrato 6">
            </div>
            <div class="imagen-card">
                <img src="img/retratos7.jpg" alt="Retrato 7">
            </div>
            <div class="imagen-card">
                <img src="img/retratos8.jpg" alt="Retrato 8">
            </div>
            <div class="imagen-card">
                <img src="img/retratos9.jpg" alt="Retrato 9">
            </div>
            <div class="imagen-card">
                <img src="img/retratos10.jpg" alt="Retrato 10">
            </div>
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-image" id="lightbox-img">
        <button class="lightbox-prev">&lt;</button>
        <button class="lightbox-next">&gt;</button>
    </div>

    <footer>
        <p>© 2025 La Sessione Fotografica - Todos los derechos reservados</p>
    </footer>
    <script src="galeria.js"></script>
</body>
</html>
